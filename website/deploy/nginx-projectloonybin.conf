# LooneyBin stats — nginx vhost. Name-based virtual host: matches Host
# projectloonybin.com and wins over the catch-all default_server (Mainsail).
# Install: /etc/nginx/sites-available/projectloonybin  +  symlink into sites-enabled.
#
# TLS is terminated at Cloudflare (orange-cloud). Origin stays HTTP :80.
# Set Cloudflare SSL/TLS mode to "Flexible" (or "Full" once you add an origin cert).

server {
    listen 80;
    listen [::]:80;
    server_name projectloonybin.com www.projectloonybin.com;

    access_log /var/log/nginx/projectloonybin.access.log;
    error_log  /var/log/nginx/projectloonybin.error.log;

    client_max_body_size 4m;

    # only trust the real client IP from Cloudflare (optional but recommended:
    # add Cloudflare's IP ranges via set_real_ip_from for accurate logs).
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # CF terminates TLS
        proxy_read_timeout 120s;
    }
}
